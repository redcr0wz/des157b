<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Liberty</title>

    <!-- normalize -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sen&display=swap" rel="stylesheet">

    <!-- link to custom css -->
    <link href="styles.css" rel="stylesheet">

    <!-- granim -->
    <script src="granim.min.js"></script>

    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/SplitText.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/Draggable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/InertiaPlugin.min.js"></script>

    <!-- link to custom js -->
    <script src="script.js" defer></script>
</head>
<body>
    <div id="bubble">
        <p>Wanna play with some text?</p>
    </div>

    <div id="text">
        Click Me!
    </div>

    <footer>
        <p><a href="https://gsap.com/">GSAP</a> &#183; <a href="https://sarcadass.github.io/granim.js/">Granim</a></p>
    </footer>
    
    <canvas id="granim-canvas"></canvas>
</body>
</html>
